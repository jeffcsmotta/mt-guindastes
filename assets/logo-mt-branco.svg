<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Industrial Emblem: Crane Boom & Heavy Structure -->
  <g transform="translate(4, 6)">
    <!-- Shield / Boom Base -->
    <rect x="0" y="2" width="44" height="44" rx="8" fill="#161B24" stroke="#2A3447" stroke-width="1.5"/>
    <path d="M4 38 L40 6" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 40 L40 16" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <!-- Heavy M -->
    <path d="M10 36 V16 L18 28 L26 16 V36" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Safety Accent Dot / Pivot Pin -->
    <circle cx="40" cy="6" r="3.5" fill="#EA580C"/>
    <circle cx="40" cy="6" r="1.5" fill="#FFFFFF"/>
  </g>
  
  <!-- Logotype Typography -->
  <g transform="translate(62, 10)">
    <!-- Primary Brand Name -->
    <text x="0" y="22" font-family="'Barlow', 'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="1">MT <tspan fill="#EA580C">GUINDASTES</tspan></text>
    <!-- Subtitle: Specialization & Official Dealer -->
    <text x="1" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#94A3B8" letter-spacing="1.8">PEÇAS &amp; IMPLEMENTOS · REVENDA TKA</text>
  </g>
</svg>
